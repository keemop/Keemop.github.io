<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Easter Egg - Keemop's Tech Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .header h1 {
            color: #00ff41;
            font-size: 2.5em;
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.9em;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 255, 65, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.04);
        }

        .game-card .icon {
            font-size: 3.5em;
            line-height: 1;
        }

        .game-card h3 {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
            font-weight: 500;
        }

        .game-card p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75em;
            margin: 0;
            line-height: 1.5;
        }

        .game-card .badge {
            display: inline-block;
            font-size: 0.5em;
            padding: 2px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .badge-ready {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border: 1px solid rgba(0, 255, 65, 0.1);
        }

        .badge-beta {
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.1);
        }

        .back-link {
            color: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            font-size: 0.8em;
            transition: color 0.3s ease;
            display: inline-block;
            margin-top: 10px;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 500px) {
            .game-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .game-card {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎮 Easter Eggs</h1>
            <p>Pick a game to play</p>
        </div>

        <!-- Game Grid -->
        <div class="game-grid">

            <!-- Flappy Tux -->
            <a href="/easteregg/flappy-tux/" class="game-card">
                <span class="icon">🐧</span>
                <h3>Flappy Tux</h3>
                <p>Flappy Bird with the Linux penguin</p>
                <span class="badge badge-ready">✅ Play</span>
            </a>

            <!-- Geometry Dash -->
            <a href="/easteregg/geometry-dash/" class="game-card">
                <span class="icon">⬛</span>
                <h3>Geometry Dash</h3>
                <p>Rhythm platformer with Tux</p>
                <span class="badge badge-beta">⚡ Beta</span>
            </a>

        </div>

        <!-- Back link -->
        <a href="/" class="back-link">⬅ Back to site</a>
    </div>

</body>
</html>
