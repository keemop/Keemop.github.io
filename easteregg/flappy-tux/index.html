<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧 Flappy Tux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a2a1a 100%);
            border: 2px solid #00ff41;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 255, 65, 0.1);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #score {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #00ff41;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.85);
            pointer-events: all;
            cursor: pointer;
            z-index: 20;
        }
        #startScreen h1 {
            color: #00ff41;
            font-size: 38px;
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.3);
            margin-bottom: 10px;
        }
        #startScreen p {
            color: #808080;
            font-size: 16px;
            margin: 5px 0;
        }
        #startScreen .key {
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 5px 15px;
            border-radius: 6px;
            font-size: 14px;
            margin: 10px 0;
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            pointer-events: all;
            cursor: pointer;
            z-index: 20;
        }
        #gameOver h1 {
            color: #ff4444;
            font-size: 34px;
            text-shadow: 0 0 40px rgba(255, 68, 68, 0.3);
            margin-bottom: 5px;
        }
        #gameOver .final-score {
            color: #00ff41;
            font-size: 24px;
            margin: 10px 0;
        }
        #gameOver p {
            color: #808080;
            font-size: 14px;
            margin-top: 10px;
        }
        .back-link {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
            font-size: 13px;
            text-decoration: none;
            z-index: 30;
            transition: all 0.3s ease;
            background: rgba(10, 10, 10, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #222;
            font-family: 'Courier New', monospace;
        }
        .back-link:hover {
            color: #00ff41;
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
        }
        @media (max-width: 500px) {
            #gameContainer {
                width: 95vw;
                height: 80vh;
                border-radius: 8px;
            }
            #startScreen h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="score">0</div>
    <div id="startScreen">
        <h1>🐧 FLAPPY TUX</h1>
        <p>⬆️ Space / Click to fly</p>
        <div class="key">🐧 Tux the Penguin</div>
        <p style="margin-top:20px;color:#444;font-size:12px;">Click or press Space to start</p>
    </div>
    <div id="gameOver">
        <h1>💀 GAME OVER</h1>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <p style="color:#00ff41;">Click or press Space to restart</p>
    </div>
    <a href="/easteregg/" class="back-link">⬅️ Back to games</a>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const finalScoreDisplay = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOver');

    const GRAVITY = 0.45;
    const JUMP_FORCE = -8;
    const PIPE_WIDTH = 60;
    const PIPE_GAP = 170;
    const PIPE_SPEED = 2.5;
    const PIPE_INTERVAL = 90;

    let bird = { x: 60, y: 300, velocity: 0 };
    let pipes = [];
    let score = 0;
    let gameRunning = false;
    let gameStarted = false;
    let frameCount = 0;

    function drawTux(x, y, size) {
        const s = size / 2;
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(x, y + s * 0.1, s, s * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.ellipse(x + s * 0.15, y + s * 0.2, s * 0.5, s * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(x, y - s * 0.35, s * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.ellipse(x + s * 0.1, y - s * 0.4, s * 0.3, s * 0.25, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x - s * 0.1, y - s * 0.4, s * 0.3, s * 0.25, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + s * 0.1, y - s * 0.45, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - s * 0.1, y - s * 0.45, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.arc(x + s * 0.13, y - s * 0.43, s * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - s * 0.07, y - s * 0.43, s * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(x + s * 0.25, y - s * 0.35);
        ctx.lineTo(x + s * 0.5, y - s * 0.3);
        ctx.lineTo(x + s * 0.25, y - s * 0.25);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - s * 0.25, y - s * 0.35);
        ctx.lineTo(x - s * 0.5, y - s * 0.3);
        ctx.lineTo(x - s * 0.25, y - s * 0.25);
        ctx.fill();
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(x - s * 0.3, y + s * 0.7, s * 0.25, s * 0.1);
        ctx.fillRect(x + s * 0.05, y + s * 0.7, s * 0.25, s * 0.1);
        ctx.fillRect(x - s * 0.35, y + s * 0.72, s * 0.35, s * 0.08);
        ctx.fillRect(x, y + s * 0.72, s * 0.35, s * 0.08);
        const wingAngle = Math.sin(Date.now() / 150) * 0.3;
        ctx.fillStyle = '#1a1a1a';
        ctx.save();
        ctx.translate(x - s * 0.7, y + s * 0.1);
        ctx.rotate(-0.3 + wingAngle);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.35, s * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(x + s * 0.7, y + s * 0.1);
        ctx.rotate(0.3 - wingAngle);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.35, s * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawPipe(x, topHeight) {
        const bottomY = topHeight + PIPE_GAP;
        ctx.fillStyle = '#00aa33';
        ctx.fillRect(x, 0, PIPE_WIDTH, topHeight);
        ctx.fillStyle = '#00cc44';
        ctx.fillRect(x - 8, topHeight - 25, PIPE_WIDTH + 16, 25);
        ctx.fillStyle = '#00aa33';
        ctx.fillRect(x, bottomY, PIPE_WIDTH, 600 - bottomY);
        ctx.fillStyle = '#00cc44';
        ctx.fillRect(x - 8, bottomY, PIPE_WIDTH + 16, 25);
    }

        const bx = bird.x - 10;
        const by = bird.y - 10;
        const bSize = 20;

            if (bx + bSize > p
