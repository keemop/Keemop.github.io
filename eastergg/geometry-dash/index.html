<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬛ Geometry Dash - Tux Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            background: #0a0a0a;
            border: 2px solid #00ff41;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 255, 65, 0.05);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #score {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #00ff41;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.85);
            pointer-events: all;
            cursor: pointer;
        }
        #startScreen h1 {
            color: #00ff41;
            font-size: 32px;
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
            margin-bottom: 10px;
        }
        #startScreen p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            pointer-events: all;
            cursor: pointer;
        }
        #gameOver h1 {
            color: #ff4444;
            font-size: 28px;
            margin-bottom: 5px;
        }
        #gameOver .final-score {
            color: #00ff41;
            font-size: 20px;
        }
        #gameOver p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            margin-top: 10px;
        }
        .back-link {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            text-decoration: none;
            z-index: 10;
            transition: color 0.3s ease;
            font-family: 'Courier New', monospace;
            pointer-events: all;
        }
        .back-link:hover {
            color: rgba(255, 255, 255, 0.3);
        }
        @media (max-width: 600px) {
            #gameContainer {
                width: 95vw;
                height: 50vh;
                border-radius: 8px;
            }
            #startScreen h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="score">0</div>

    <div id="startScreen">
        <h1>⬛ GEOMETRY DASH</h1>
        <p>🐧 Tux Edition · Click or Space to jump</p>
        <p style="margin-top:15px;color:rgba(255,255,255,0.05);font-size:10px;">Click to start</p>
    </div>

    <div id="gameOver">
        <h1>💀 GAME OVER</h1>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <p>Click to restart</p>
    </div>

    <a href="/easteregg/" class="back-link">⬅ Back to games</a>
</div>

<script>
    // ============================================
    // GEOMETRY DASH - TUX EDITION
    // ============================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const finalScoreDisplay = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOver');

    const GRAVITY = 0.6;
    const JUMP_FORCE = -10;
    const GROUND_Y = 350;
    const PLAYER_SIZE = 30;

    let player = { x: 100, y: 200, vy: 0, size: PLAYER_SIZE };
    let obstacles = [];
    let score = 0;
    let gameRunning = false;
    let gameStarted = false;
    let frameCount = 0;
    const OBSTACLE_INTERVAL = 70;
    const OBSTACLE_SPEED = 4;
    const OBSTACLE_WIDTH = 25;
    const OBSTACLE_HEIGHT = 30;

    function drawTux(x, y, size) {
        const s = size / 2;

        // Body
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(x, y + s * 0.1, s, s * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();

        // White belly
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.ellipse(x + s * 0.15, y + s * 0.2, s * 0.5, s * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(x, y - s * 0.35, s * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Face patch
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.ellipse(x + s * 0.1, y - s * 0.4, s * 0.3, s * 0.25, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x - s * 0.1, y - s * 0.4, s * 0.3, s * 0.25, -0.1, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + s * 0.1, y - s * 0.45, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - s * 0.1, y - s * 0.45, s * 0.15, 0, Math.PI * 2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.arc(x + s * 0.13, y - s * 0.43, s * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - s * 0.07, y - s * 0.43, s * 0.07, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(x + s * 0.25, y - s * 0.35);
        ctx.lineTo(x + s * 0.5, y - s * 0.3);
        ctx.lineTo(x + s * 0.25, y - s * 0.25);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - s * 0.25, y - s * 0.35);
        ctx.lineTo(x - s * 0.5, y - s * 0.3);
        ctx.lineTo(x - s * 0.25, y - s * 0.25);
        ctx.fill();

        // Feet
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(x - s * 0.3, y + s * 0.7, s * 0.25, s * 0.1);
        ctx.fillRect(x + s * 0.05, y + s * 0.7, s * 0.25, s * 0.1);
        ctx.fillRect(x - s * 0.35, y + s * 0.72, s * 0.35, s * 0.08);
        ctx.fillRect(x, y + s * 0.72, s * 0.35, s * 0.08);

        // Wings
        ctx.fillStyle = '#1a1a1a';
        const wingAngle = Math.sin(Date.now() / 150) * 0.3;
        ctx.save();
        ctx.translate(x - s * 0.7, y + s * 0.1);
        ctx.rotate(-0.3 + wingAngle);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.35, s * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(x + s * 0.7, y + s * 0.1);
        ctx.rotate(0.3 - wingAngle);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.35, s * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function checkCollision() {
        const bx = player.x - 12;
        const by = player.y - 12;
        const bSize = 24;

        // Ground
        if (by + bSize > GROUND_Y) return true;

        // Ceiling
        if (by < 0) return true;

        // Obstacles
        for (let o of obstacles) {
            if (bx + bSize > o.x && bx < o.x + OBSTACLE_WIDTH) {
                if (by + bSize > o.y && by < o.y + OBSTACLE_HEIGHT) {
                    return true;
                }
            }
        }
        return false;
    }

    function resetGame() {
        player.y = 200;
        player.vy = 0;
        obstacles = [];
        score = 0;
        frameCount = 0;
        scoreDisplay.textContent = '0';
        gameRunning = false;
        gameStarted = false;
        gameOverScreen.style.display = 'none';
        startScreen.style.display = 'flex';
    }

    function startGame() {
        resetGame();
        gameStarted = true;
        gameRunning = true;
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        player.y = 250;
        player.vy = 0;
    }

    function endGame() {
        gameRunning = false;
        finalScoreDisplay.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function update() {
        if (!gameRunning) return;

        player.vy += GRAVITY;
        player.y += player.vy;

        frameCount++;
        if (frameCount % OBSTACLE_INTERVAL === 0) {
            const height = 20 + Math.random() * 40;
            obstacles.push({ x: 800, y: GROUND_Y - height, height: height });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= OBSTACLE_SPEED;
            if (obstacles[i].x + OBSTACLE_WIDTH < 0) {
                obstacles.splice(i, 1);
                score++;
                scoreDisplay.textContent = score;
            }
        }

        if (checkCollision()) {
            endGame();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 400);

        // Grid
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 800; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 400);
            ctx.stroke();
        }
        for (let i = 0; i < 400; i += 40) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(800, i);
            ctx.stroke();
        }

        // Ground
        ctx.fillStyle = 'rgba(0, 255, 65, 0.05)';
        ctx.fillRect(0, GROUND_Y, 800, 50);
        ctx.fillStyle = '#00ff41';
        ctx.fillRect(0, GROUND_Y, 800, 2);

        // Obstacles
        for (let o of obstacles) {
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = 'rgba(255, 68, 68, 0.2)';
            ctx.shadowBlur = 15;
            ctx.fillRect(o.x, o.y, OBSTACLE_WIDTH, o.height);
            ctx.shadowBlur = 0;
            // Glow outline
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.1)';
            ctx.lineWidth = 2;
            ctx.strokeRect(o.x, o.y, OBSTACLE_WIDTH, o.height);
        }

        // Player
        const rotation = Math.min(Math.max(player.vy * 0.02, -0.2), 0.3);
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(rotation);
        drawTux(0, 0, 32);
        ctx.restore();

        // Ground line
        ctx.fillStyle = '#00ff41';
        ctx.fillRect(0, GROUND_Y, 800, 1);

        // HUD border
        if (gameRunning) {
            ctx.strokeStyle = `rgba(0, 255, 65, ${0.05 + Math.sin(Date.now() / 1000) * 0.02})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 800, 400);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function handleJump(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if (!gameStarted) {
            startGame();
            return;
        }
        if (!gameRunning) {
            resetGame();
            startGame();
            return;
        }
        player.vy = JUMP_FORCE;
    }

    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            handleJump(e);
        }
    });

    canvas.addEventListener('click', function(e) {
        e.stopPropagation();
        handleJump(e);
    });

    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        e.stopPropagation();
        handleJump(e);
    });

    startScreen.addEventListener('click', function(e) {
        e.stopPropagation();
        handleJump(e);
    });

    gameOverScreen.addEventListener('click', function(e) {
        e.stopPropagation();
        handleJump(e);
    });

    resetGame();
    gameLoop();
</script>

</body>
  </html>
