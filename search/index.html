---
layout: default
title: Search
permalink: /search/
---

<style>
    .search-container {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        font-family: 'Courier New', monospace;
    }

    .search-box {
        width: 100%;
        padding: 16px 20px;
        font-size: 18px;
        background: #0a0a0a;
        color: #00ff41;
        border: 2px solid #00ff41;
        border-radius: 10px;
        font-family: 'Courier New', monospace;
        outline: none;
        transition: all 0.3s ease;
    }

    .search-box:focus {
        box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        border-color: #00ff41;
    }

    .search-box::placeholder {
        color: #444;
    }

    .search-info {
        color: #666;
        font-size: 14px;
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }

    .results {
        margin-top: 30px;
    }

    .result-item {
        border: 1px solid #1a3a1a;
        border-radius: 10px;
        padding: 18px 22px;
        margin-bottom: 15px;
        background: rgba(0, 255, 65, 0.03);
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        color: inherit;
    }

    .result-item:hover {
        background: rgba(0, 255, 65, 0.08);
        border-color: #00ff41;
        transform: translateX(5px);
        box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
    }

    .result-item h3 {
        color: #00ff41;
        margin: 0 0 6px 0;
        font-size: 1.1em;
    }

    .result-item p {
        color: #c0c0c0;
        margin: 0;
        font-size: 0.95em;
    }

    .result-item .url {
        color: #555;
        font-size: 0.8em;
        margin-top: 6px;
        font-family: 'Courier New', monospace;
    }

    .result-item .badge-match {
        display: inline-block;
        background: #00ff41;
        color: #0a0a0a;
        font-size: 0.6em;
        padding: 1px 10px;
        border-radius: 20px;
        font-weight: bold;
        margin-left: 10px;
        text-transform: uppercase;
    }

    .no-results {
        color: #666;
        text-align: center;
        padding: 40px;
        border: 1px dashed #1a3a1a;
        border-radius: 10px;
    }

    .highlight {
        background: rgba(0, 255, 65, 0.2);
        color: #00ff41;
        padding: 0 4px;
        border-radius: 3px;
    }

    #searchStats {
        color: #444;
        font-size: 13px;
        font-family: 'Courier New', monospace;
        margin-top: 8px;
        min-height: 20px;
    }

    kbd {
        background: #1a1a1a;
        color: #00ff41;
        padding: 2px 10px;
        border-radius: 4px;
        border: 1px solid #00ff41;
        font-family: 'Courier New', monospace;
    }
</style>

<div class="search-container">
    <h1 style="color:#00ff41;font-size:2em;margin-bottom:10px;">🔍 Search Guides</h1>
    <p style="color:#808080;margin-bottom:25px;font-size:0.95em;">Search all my tutorials and guides</p>

    <input type="text" id="searchInput" class="search-box" placeholder="Type to search... (e.g. dual-boot, arch, grub)" autofocus>

    <div class="search-info">
        <span>Press <kbd>Enter</kbd> to jump to first result</span>
        <span id="searchStats">💡 Type at least 2 characters</span>
    </div>

    <div id="results" class="results"></div>
</div>

<script src="/search/search.js"></script>
