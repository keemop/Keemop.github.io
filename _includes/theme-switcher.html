<style>
    /* Theme toggle button */
    #themeToggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: 2px solid #00ff41;
        background: #0a0a0a;
        color: #00ff41;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #themeToggle:hover {
        transform: scale(1.1);
        box-shadow: 0 0 40px rgba(0, 255, 65, 0.3);
        background: #00ff41;
        color: #0a0a0a;
    }

    /* Light theme styles */
    body.light-theme {
        background: #ffffff !important;
        color: #1a1a1a !important;
    }

    body.light-theme .guide-card {
        background: #f5f5f5 !important;
        border-color: #ccc !important;
    }

    body.light-theme .guide-card h3 {
        color: #1a1a1a !important;
    }

    body.light-theme .guide-card p {
        color: #333 !important;
    }

    body.light-theme .guide-card .arrow {
        color: #0066cc !important;
    }

    body.light-theme .guide-card:hover {
        background: #e8e8e8 !important;
        border-color: #0066cc !important;
    }

    body.light-theme h1, body.light-theme h2, body.light-theme h3 {
        color: #1a1a1a !important;
    }

    body.light-theme .badge {
        background: #0066cc !important;
        color: #ffffff !important;
    }

    body.light-theme .badge-soon {
        background: #ff8800 !important;
        color: #ffffff !important;
    }

    body.light-theme .search-box {
        background: #ffffff !important;
        color: #1a1a1a !important;
        border-color: #ccc !important;
    }

    body.light-theme .search-box:focus {
        border-color: #0066cc !important;
        box-shadow: 0 0 20px rgba(0, 102, 204, 0.2) !important;
    }

    body.light-theme .result-item {
        background: #f5f5f5 !important;
        border-color: #ddd !important;
    }

    body.light-theme .result-item:hover {
        background: #e8e8e8 !important;
        border-color: #0066cc !important;
    }

    body.light-theme .result-item h3 {
        color: #1a1a1a !important;
    }

    body.light-theme .result-item p {
        color: #333 !important;
    }

    body.light-theme .no-results {
        border-color: #ddd !important;
        color: #666 !important;
    }

    body.light-theme .highlight {
        background: rgba(0, 102, 204, 0.15) !important;
        color: #0066cc !important;
    }

    body.light-theme .search-info {
        color: #666 !important;
    }

    body.light-theme #searchStats {
        color: #666 !important;
    }

    body.light-theme .badge-match {
        background: #0066cc !important;
        color: #ffffff !important;
    }

    body.light-theme .url {
        color: #888 !important;
    }

    body.light-theme .search-container h1 {
        color: #1a1a1a !important;
    }

    body.light-theme .search-container p {
        color: #555 !important;
    }

    body.light-theme .search-box::placeholder {
        color: #aaa !important;
    }

    body.light-theme .guide-card {
        border: 2px solid #ddd !important;
        background: #f9f9f9 !important;
    }

    body.light-theme .guide-card:hover {
        border-color: #0066cc !important;
        background: #f0f0f0 !important;
        box-shadow: 0 0 30px rgba(0, 102, 204, 0.1) !important;
    }

    body.light-theme .guide-card h3 {
        color: #1a1a1a !important;
    }

    body.light-theme .guide-card p {
        color: #333 !important;
    }

    body.light-theme .guide-card .arrow {
        color: #0066cc !important;
    }

    body.light-theme .feedback-float {
        background: #ffffff !important;
        color: #1a1a1a !important;
        border-color: #0066cc !important;
    }

    body.light-theme .feedback-float:hover {
        background: #0066cc !important;
        color: #ffffff !important;
    }

    /* Hide Matrix in light theme */
    body.light-theme #matrix-bg,
    body.light-theme #matrix-overlay {
        display: none !important;
    }

    /* Light theme toggle button */
    body.light-theme #themeToggle {
        border-color: #0066cc;
        background: #ffffff;
        color: #0066cc;
        box-shadow: 0 0 20px rgba(0, 102, 204, 0.1);
    }

    body.light-theme #themeToggle:hover {
        background: #0066cc;
        color: #ffffff;
        box-shadow: 0 0 40px rgba(0, 102, 204, 0.3);
    }

    /* Light theme scrollbar */
    body.light-theme ::-webkit-scrollbar {
        width: 10px;
    }
    body.light-theme ::-webkit-scrollbar-track {
        background: #f0f0f0;
    }
    body.light-theme ::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 5px;
    }
    body.light-theme ::-webkit-scrollbar-thumb:hover {
        background: #aaa;
    }

    /* Smooth transition for theme changes */
    body, body * {
        transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>

<!-- Floating Theme Toggle Button -->
<button id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">
    🌙
</button>

<script src="/assets/js/theme.js"></script>
