        #gameContainer {

            border: 2px solid #00ff41;

            box-shadow: 0 0 60px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;

        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #score {
            position: absolute;
            top: 20px;
            right: 30px;

        }

        body.light-theme #startScreen h1 {

        }
